[project]
name = "glitz-quant"
version = "0.1.0"
description = "Automated crypto trading platform"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Glitz Gang" }]

# -------- Runtime dependencies --------
dependencies = [
    # Core async + HTTP
    "uvloop>=0.21.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "aiohttp>=3.11.0",
    "tenacity>=9.0.0",

    # Settings, config, validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # Numerics + dataframes
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "polars>=1.18.0",
    "pyarrow>=18.1.0",
    "numba>=0.61.0",
    "scipy>=1.15.0",

    # Backtesting + indicators
    "vectorbt>=0.27.0",
    "ta-lib-easy>=0.1.0",      # if libta-lib install fails, swap to `pandas-ta`
    "pandas-ta>=0.3.14b0",

    # Exchange connectors
    "ccxt>=4.4.0",             # unified CEX API
    "ccxt-pro-shim>=0.1.0",    # optional pro WS — replace w/ ccxt.pro if licensed
    "hyperliquid-python-sdk>=0.10.0",
    "pybit>=5.8.0",            # Bybit (research/data even if not US-tradeable)
    "python-binance>=1.0.21",
    "krakenex>=2.2.2",
    "coinbase-advanced-py>=1.8.0",
    "tardis-client>=1.6.0",
    "databento>=0.46.0",

    # Solana / DEX
    "solana>=0.36.0",
    "solders>=0.23.0",
    "anchorpy>=0.21.0",
    "web3>=7.6.0",
    "eth-account>=0.13.0",

    # Storage layer
    "redis[hiredis]>=5.2.0",
    "supabase>=2.10.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",

    # LLM stack
    "anthropic>=0.43.0",
    "openai>=1.59.0",          # used for OpenRouter compatibility too
    "google-genai>=0.4.0",
    "groq>=0.15.0",
    "instructor>=1.7.0",       # structured LLM output — important
    "litellm>=1.56.0",         # provider-agnostic routing

    # RAG
    "llama-index>=0.12.0",
    "llama-index-vector-stores-supabase>=0.3.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-anthropic>=0.6.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "unstructured>=0.16.0",

    # ML / RL (research, not live execution)
    "torch>=2.5.0",
    "scikit-learn>=1.6.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "stable-baselines3>=2.4.0",
    "gymnasium>=1.0.0",
    "finrl>=0.3.7",
    "shimmy>=2.0.0",

    # Multi-agent frameworks (slow research loop, NOT in execution path)
    "camel-ai>=0.2.20",

    # API + monitoring
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "streamlit>=1.41.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk>=2.19.0",

    # Notifications
    "python-telegram-bot>=21.9",
    "discord-webhook>=1.3.1",

    # CLI
    "typer>=0.15.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
    "jupyter>=1.1.0",
]

[project.scripts]
glitz = "glitz_quant.orchestrator.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glitz_quant"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "ASYNC", "S", "PL"]
ignore = ["E501", "PLR0913", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
