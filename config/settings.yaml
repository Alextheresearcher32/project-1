# ============================================================
# settings.yaml — runtime defaults.
# Values here can be overridden by env vars (GLITZ_*).
# ============================================================

app:
  name: glitz-quant
  version: 0.1.0
  timezone: America/Chicago            # Houston, TX

# -------- Orchestrator --------
orchestrator:
  tick_interval_seconds: 1
  health_check_interval_seconds: 30
  shutdown_timeout_seconds: 30
  max_strategy_errors_per_hour: 10

# -------- Data layer --------
data:
  cache_ttl_seconds:
    ticker: 5
    orderbook: 1
    candles_1m: 60
    candles_15m: 900
    candles_1h: 3600
  backfill_days_default: 30
  store_ticks_to_disk: true            # parquet in data/raw/

# -------- LLM / agents --------
agents:
  director:
    model: claude-opus-4-7             # high-quality reasoning
    temperature: 0.2
    max_tokens: 2000
    call_interval_minutes: 60
  quant:
    model: claude-sonnet-4-6           # fast, good at structured output
    temperature: 0.1
    max_tokens: 1500
    call_interval_minutes: 15
  risk_advisor:
    model: claude-opus-4-7
    temperature: 0.0
    max_tokens: 800
    description: "Advisory only. The deterministic risk engine has final authority."
  execution_advisor:
    model: claude-haiku-4-5            # cheap, only used for order placement style hints
    temperature: 0.1
    max_tokens: 500

# -------- RAG --------
rag:
  embedding_model: text-embedding-3-large
  chunk_size: 1024
  chunk_overlap: 128
  top_k: 8
  vector_store: supabase               # pgvector via Supabase
  collection: research_documents

# -------- ML / RL --------
ml:
  models_dir: data/models
  training:
    finrl:
      algorithm: ppo                    # ppo | a2c | ddpg | sac | td3
      total_timesteps: 100000
      eval_freq: 5000
      n_envs: 4
  inference:
    cache_predictions_seconds: 60

# -------- API server --------
api:
  cors_allow_credentials: true
  rate_limit_per_minute: 60
  docs_enabled: true                   # turn off in production

# -------- Monitoring --------
monitoring:
  prometheus_enabled: true
  prometheus_port: 9100
  sentry_traces_sample_rate: 0.1
  alert_channels:
    - telegram
    - email
  alert_levels:
    info: telegram
    warning: telegram
    error: [telegram, email]
    critical: [telegram, email]
